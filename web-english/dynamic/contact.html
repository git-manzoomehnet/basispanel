<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Basis Panel</title>
    <link rel="stylesheet" href="[##cms.cms.cdn##]/asset/css/swiper-bundle.min.css">
    <basis core="call" file="style-en-v3.inc" pageindex="[##cms.cms.pageindex##]" />
    <style>
        * {
            direction: ltr;
        }

        .contact-container {
            margin-top: 200px;
        }

        .contact-description {
            width: 50%;
            margin: 0 auto;
        }

        .contact-description h1 {
            color: #494949;
            font-size: 30px;
            font-family: IRANSansWeb900;
            text-align: center;
            margin-bottom: 38px;
            margin-top: 40px;
        }

        .contact-description p {
            color: #68737C;
            font-family: IRANSansWeb500;
            text-align: center;
            line-height: 40px;
        }

        .info {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .infoBox {
            width: 420px;
            height: 123px;
            background-color: #E6EDF3;
            margin-right: 50px;
            display: flex;
            padding: 28px 11px;
            border-radius: 10px;
        }

        .info img {
            width: 67px;
            height: 67px;
            border-radius: 5px;
            background-color: white;
            padding: 7px;
        }

        .info-content {
            margin-left: 22px;
            padding: 5px 0;
        }

        .info-content span {
            color: #000000;
            font-family: IRANSansWeb700;
            font-size: 18px;
        }

        .info-content p {
            color: #000000;
            font-family: IRANSansWeb400;
            font-size: 14px;
        }

        .map {
            width: 100%;
            height: 800px;
            margin-top: 150px;
            margin-bottom: 78px;
        }

        .map img {
            position: relative;
            z-index: -1;
            top: -509px;
        }

        iframe {
            margin: auto;
            border-radius: 10px;
        }

        .intro-container {
            width: 50%;
            margin: 0 auto;
            padding-top: 6%;
        }

        .intro {
            width: 57%;
            margin: 0 auto;
        }

        .module {
            display: flex;
            justify-content: space-evenly;
            margin-bottom: 28px;
        }

        .intro > p {
            color: #68737C;
            font-size: 16px;
            font-family: IRANSansWeb500;
            margin-bottom: 20px;
            text-align: center;
        }

        .module span {
            margin-right: 5px;
            color: #000000;
            font-family: IRANSansWeb500;
            font-size: 14px;
            display: flex;
            justify-content: center;
        }

        .intro-container a {
            color: #004B85;
            text-decoration: underline;
            font-size: 16px;
        }

        .moduleItem img {
            width: 60px;
            height: 60px;
        }
    </style>
</head>

<body>
    <basis core="call" file="checkLogin-header-en-v3.inc" pageindex="[##cms.cms.pageindex##]" />

    <div class="contact-container">
        <section class="contact-description">
            <h1>Just a Step Away</h1>
            <p>
                Would you like to learn more about BasisPanel, our products, and our services? Please send us your information so that a member of our team can contact you for a friendly conversation.
            </p>
        </section>

        <section class="info">
            <div class="infoBox">
                <img src="/images/phone-icon.png" alt="">
                <div class="info-content">
                    <span>Phone Number</span>
                    <basis core="print" datamembername="db.footer">
                        <face filter="TypeID=240">
                            <p>@answer</p>
                        </face>
                    </basis>
                </div>
            </div>

            <div class="infoBox">
                <img src="/images/mail-icon.png" alt="">
                <div class="info-content">
                    <span>Email</span>
                    <basis core="print" datamembername="db.footer">
                        <face filter="TypeID=132">
                            <p>@answer</p>
                        </face>
                    </basis>
                </div>
            </div>

            <div class="infoBox">
                <img src="/images/address-icon.png" alt="">
                <div class="info-content">
                    <span>Address</span>
                    <basis core="print" datamembername="db.footer">
                        <face filter="TypeID=244">
                            <p>@answer</p>
                        </face>
                    </basis>
                </div>
            </div>
        </section>

        <section class="map">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d809.700090544081!2d51.43385593890077!3d35.73112803846003!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3f8e06add6d1ae61%3A0x7a9bcbfabe4bb1a8!2sPersis%20Co.!5e0!3m2!1sen!2s!4v1740559614046!5m2!1sen!2s"
                width="1200" height="650" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
            <img src="/images/contactbg-v3.png" alt="">
        </section>


    </div>

    <basis core="call" file="logo-en-v3.inc" pageindex="[##cms.cms.pageindex##]" />
    <basis core="call" file="footer-en-v3.inc" pageindex="[##cms.cms.pageindex##]" />
    <basis core="call" file="script-en-v3.inc" pageindex="[##cms.cms.pageindex##]" />
</body>

</html>
