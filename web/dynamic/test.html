<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Material Design Horizontal Stepper</title>
  <link rel='stylesheet' href='https://storage.googleapis.com/code.getmdl.io/1.0.6/material.blue-indigo.min.css'><link rel="stylesheet" href="./style.css">
  <link rel='stylesheet' href="../assets/css/outputDesk-v3.css">
<style>
    /* Simple setup for this demo */


.mdl-card__supporting-text {
  width: 100%;
  padding: 0;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step {
  width: 25%;
  /* 100 / no_of_steps */
}


/* Begin actual mdl-stepper css styles */

.mdl-stepper-horizontal-alternative {
  display: table;
  width: 100%;
  margin: 0 auto;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step {
  display: table-cell;
  position: relative;
  padding: 24px;
}



.mdl-stepper-horizontal-alternative .mdl-stepper-step:active {
  border-radius: 15% / 75%;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step:first-child:active {
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step:last-child:active {
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step:hover .mdl-stepper-circle {
  background-color: #757575;
  position: relative;
}
.mdl-stepper-horizontal-alternative .mdl-stepper-step .mdl-stepper-circle::before{
content: "";
width: 42px;
height:42px;
border-radius: 100%;
border: 3px solid #9E9E9E;
position: absolute;
}
.mdl-stepper-horizontal-alternative .mdl-stepper-step.active-step .mdl-stepper-circle::before
{
border: 3px solid #00A693 ;
}
.mdl-stepper-horizontal-alternative .mdl-stepper-step:first-child .mdl-stepper-bar-left,
.mdl-stepper-horizontal-alternative .mdl-stepper-step:last-child .mdl-stepper-bar-right {
  display: none;
}
.mdl-stepper-horizontal-alternative .mdl-stepper-step:last-child .mdl-stepper-bar-left{
    display: none;
}
.mdl-stepper-horizontal-alternative .mdl-stepper-step .mdl-stepper-circle {
  width: 32px;
  height: 32px;
  margin: 0 auto;
  background-color: #9E9E9E;
  border-radius: 50%;
  text-align: center;
  line-height: 2em;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: white;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step.active-step .mdl-stepper-circle {
  background-color: #00A693 ;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step.active-step .mdl-stepper-bar-right,
.mdl-stepper-horizontal-alternative .mdl-stepper-step.active-step .mdl-stepper-bar-left{
border-color: #00A693 ;
}
.mdl-stepper-horizontal-alternative .mdl-stepper-step.active-step:nth-last-child(n){
    border-color: #9E9E9E ;
}
.mdl-stepper-horizontal-alternative .mdl-stepper-step.active-step:nth-last-child(n) .mdl-stepper-bar-right,
.mdl-stepper-horizontal-alternative .mdl-stepper-step.active-step:nth-last-child(n) .mdl-stepper-bar-left{
border-color: #9E9E9E ;
}
.mdl-stepper-horizontal-alternative .mdl-stepper-step.editable-step .mdl-stepper-circle:before {
  content: "\270E";
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step .mdl-stepper-title {
  margin-top: 16px;
  font-size: 14px;
  font-weight: normal;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step .mdl-stepper-title,
.mdl-stepper-horizontal-alternative .mdl-stepper-step .mdl-stepper-optional {
  text-align: center;
  color: rgba(0, 0, 0, .26);
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step.active-step .mdl-stepper-title {
  font-weight: 500;
  color: rgba(0, 0, 0, .87);
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step.active-step.editable-step .mdl-stepper-title {
  font-weight: 300;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step .mdl-stepper-optional {
  font-size: 12px;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step.active-step .mdl-stepper-optional {
  color: rgba(0, 0, 0, .54);
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step .mdl-stepper-bar-left,
.mdl-stepper-horizontal-alternative .mdl-stepper-step .mdl-stepper-bar-right {
  position: absolute;
  top: 40px;
  height: 1px;
  border-top: 1px solid #BDBDBD;
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step .mdl-stepper-bar-right {
    right: 54.5%;
    margin-left: 20px;
    width: calc(100% - 32px);
}

.mdl-stepper-horizontal-alternative .mdl-stepper-step .mdl-stepper-bar-left {
  left: 0;
  right: 50%;
  margin-right: 20px;
}
</style>
</head>
<body>
<!-- partial:index.partial.html -->
<div dir="rtl" class="mdl-card w-full">

  <div class="mdl-card__supporting-text">

    <div class="mdl-stepper-horizontal-alternative">
      <div class="mdl-stepper-step active-step ">
        <div class="mdl-stepper-circle"><span>1</span></div>
        <div class="mdl-stepper-bar-left"></div>
        <div class="mdl-stepper-bar-right"></div>
      </div>
      <div class="mdl-stepper-step active-step ">
        <div class="mdl-stepper-circle"><span>2</span></div>

        <div class="mdl-stepper-bar-left"></div>
        <div class="mdl-stepper-bar-right"></div>
      </div>
      <div class="mdl-stepper-step active-step">
        <div class="mdl-stepper-circle"><span>3</span></div>

        <div class="mdl-stepper-bar-left"></div>
        <div class="mdl-stepper-bar-right"></div>
      </div>
      <div class="mdl-stepper-step">
        <div class="mdl-stepper-circle"><span>4</span></div>

        <div class="mdl-stepper-bar-left"></div>
        <div class="mdl-stepper-bar-right"></div>
      </div>
    </div>

  </div>

</div>
<!-- partial -->
  
</body>
</html>
