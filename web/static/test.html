<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>Test Stepper</title>
  <link href="https://cdn.syncfusion.com/ej2/24.1.41/material.css" rel="stylesheet" />
  <script src="https://cdn.syncfusion.com/ej2/24.1.41/dist/ej2.min.js"></script>
</head>
<body>
  <div id="stepper"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var stepper = new ej.navigations.Stepper({
        steps: [
          { label: 'مرحله 1' },
          { label: 'مرحله 2' },
          { label: 'مرحله 3' }
        ]
      });
      stepper.appendTo('#stepper');
      console.log('Stepper created:', stepper);
    });
  </script>
</body>
</html>
